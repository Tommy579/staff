<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion : Staff Auto BDE Polytech Nice Sophia</title>
  <meta name="description" content="Connexion à l'outil de répartition des staffs BDE Polytech Nice Sophia.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="./assets/logo-bde.svg?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="./assets/favicon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://wqayghhkgbprvofojjoo.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
  <script>
    if (document.cookie.split("; ").some(function (c) {
      return c.indexOf("bde_staff_auto_pwd=") === 0 && c.length > "bde_staff_auto_pwd=".length;
    })) {
      location.replace("./config.html");
    }
  </script>
</head>
<body>
  <main class="login-gate">
    <section class="login-card" aria-labelledby="login-title">
      <div class="login-brand">
        <img class="brand-mark" src="./assets/logo-bde.svg" alt="Logo BDE Polytech Nice Sophia" width="44" height="44">
        <div>
          <h1 id="login-title" class="login-title">Configuration</h1>
          <p class="hint">BDE Polytech Nice Sophia</p>
        </div>
      </div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="login-password">Mot de passe BDE</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required placeholder="Entrez le mot de passe" autofocus aria-invalid="false">
        </div>
        <p id="login-feedback" class="hint login-error" role="status" aria-live="polite"></p>
        <button id="login-submit-btn" type="submit" class="btn btn-primary w-full">Accéder à la configuration</button>
      </form>
      <div class="login-footer">
        <p class="hint login-note">Connexion mémorisée 30 jours sur ce navigateur.</p>
        <a href="./index.html" class="btn btn-quiet btn-sm">← Retour à l'accueil</a>
      </div>
    </section>
  </main>

  <script type="module" src="./js/login.js"></script>
</body>
</html>
