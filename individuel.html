<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planning individuel : Staff Auto BDE Polytech Nice Sophia</title>
  <meta name="description" content="Consultez votre planning personnel de staff BDE Polytech Nice Sophia.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#F6F6F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E0E11" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="./assets/logo-bde.svg?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="./assets/favicon-192.png?v=2">
  <link rel="apple-touch-icon" href="./assets/favicon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://wqayghhkgbprvofojjoo.supabase.co" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="brand">
        <a href="./index.html" class="brand-link" aria-label="Retour à l'accueil">
          <img class="brand-mark" src="./assets/logo-bde.svg" alt="Logo BDE Polytech Nice Sophia" width="36" height="36">
        </a>
        <div class="brand-copy">
          <h1 class="brand-title">Planning individuel</h1>
          <span class="brand-sep" aria-hidden="true">/</span>
          <p id="schedule-subtitle" class="brand-sub">Chargement...</p>
        </div>
      </div>

      <div class="header-actions">
        <span id="readonly-status" class="sync-pill" role="status" aria-live="polite" data-tone="busy">Chargement...</span>
        <a href="./global.html" class="btn btn-quiet btn-sm">Planning global</a>
        <a href="./index.html" class="btn btn-secondary btn-sm">Accueil</a>
      </div>
    </div>
  </header>

  <main class="container container-narrow">
    <section id="member-picker-view" class="panel" aria-labelledby="picker-heading">
      <div class="section-head">
        <div>
          <h2 id="picker-heading" class="panel-title">Choisir un staffeur</h2>
          <p class="hint">Sélectionnez votre nom pour afficher uniquement vos créneaux.</p>
        </div>
      </div>
      <ul id="individual-list" class="individual-list"></ul>
    </section>

    <section id="member-detail-view" class="panel" aria-labelledby="detail-name" hidden>
      <div class="detail-head">
        <div>
          <h2 id="detail-name" class="panel-title"></h2>
          <p id="detail-arrival" class="hint"></p>
        </div>
        <button id="back-to-list-btn" type="button" class="btn btn-quiet btn-sm">← Tous les staffeurs</button>
      </div>
      <ul id="detail-shifts" class="detail-shifts"></ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>Staff Auto · BDE Polytech Nice Sophia</p>
      <p id="last-updated-note">Actualisation automatique active.</p>
    </div>
  </footer>

  <script type="module" src="./js/individuel.js"></script>
</body>
</html>
